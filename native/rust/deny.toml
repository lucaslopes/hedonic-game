# cargo-deny (https://embarkstudios.github.io/cargo-deny/): `cargo deny
# --all-features --locked check` in native/rust/, CI job `supply_chain`. The crate
# compiles pyo3 (feature `python`) and nothing else; this keeps it so.

[graph]
all-features = true

[advisories]
version = 2
# Every RustSec advisory, unmaintained and unsound crates included, fails the
# job; a yanked version too.
yanked = "deny"
ignore = []

[licenses]
version = 2
# What the dependencies are under (pyo3 and its build tree: MIT OR
# Apache-2.0; target-lexicon: Apache-2.0 WITH LLVM-exception; unicode-ident:
# (MIT OR Apache-2.0) AND Unicode-3.0), all compatible with GPL-3.0-or-later,
# the licence of this crate and of the hedonic package (pyproject.toml; CI
# checks that the two agree).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "GPL-3.0-or-later",
]
confidence-threshold = 0.93

[bans]
# One version of each crate, and no wildcard requirement.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
# crates.io only: no git dependency, no other registry.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
