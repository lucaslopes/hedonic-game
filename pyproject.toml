[project]
name = "hedonic"
version = "2.1.0"
description = "Community detection with hedonic games: best-response local moving to an equilibrium, disjoint and overlapping, in a purpose-built Rust core"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Lopes Felipe" }
]
requires-python = ">=3.12"
# `pip install hedonic` is the library alone (igraph and numpy), for use from other code. The experiment command
# line (`hedonic`, `hedonic-exp`) and every experiment of the papers need the `cli` extra:
# `pip install "hedonic[cli]"`. The command line needs macOS or Linux; Windows gets the library.
dependencies = [
    "igraph>=1.0",
    "numpy",
]
keywords = ["community detection", "hedonic games", "graphs", "networks", "overlapping communities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# One-to-one matching in hedonic.metrics (Game.evaluate_against "one_to_one_f1").
metrics = ["scipy>=1.10"]
# The experiment command line and its runs (tests/experiments need it too). The CLI refuses to start without it.
cli = [
    "scipy>=1.10",
    "pandas>=2.0; sys_platform != 'win32'",
    "matplotlib>=3.7; sys_platform != 'win32'",
    "networkx>=3.0; sys_platform != 'win32'",
    "pyarrow>=14; sys_platform != 'win32'",
    "duckdb>=1.0; sys_platform != 'win32'",
    "tqdm>=4.60; sys_platform != 'win32'",
]
# The 1.x name of the same extra.
experiments = ["hedonic[cli]"]

[project.scripts]
hedonic = "hedonic.experiments.CLI:hedonic_main"
hedonic-exp = "hedonic.experiments.CLI:main"

[project.urls]
Homepage = "https://github.com/lucaslopes/hedonic"
Documentation = "https://lucaslopes.github.io/hedonic/"

[build-system]
# maturin: the package compiles its Rust core (native/rust/) into the extension
# hedonic._core.
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "native/rust/Cargo.toml"
python-source = "src"
module-name = "hedonic._core"
# The crate's CPython module under the name hedonic._core (the feature exists
# only for this build; the crate's own tests need no Python).
features = ["core-module"]
# The package data (py.typed, the shipped run configs and the external-method
# workers, with the locked CDlib project) is everything under src/hedonic;
# hedonic.experiments.resources finds it. A compiled core left in the source
# tree by another build, caches and a worker's local environment are not.
exclude = [
    "src/hedonic/_core*.so",
    "src/hedonic/_core*.pyd",
    "src/hedonic/**/__pycache__/**",
    "src/hedonic/**/*.py[co]",
    "src/hedonic/experiments/workers/slpa_env/.venv/**",
]
