[project]
name = "hedonic"
version = "2.0.0"
description = "Community detection with hedonic games: best-response local moving to an equilibrium, disjoint and overlapping, in a purpose-built C core"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Lopes Felipe" }
]
requires-python = ">=3.12"
# The library needs igraph and numpy; the rest is the experiment CLI (`hedonic`, `hedonic-exp`), so a plain
# `pip install hedonic` can run every experiment of the papers.
# The experiment command line (hedonic run ..., hedonic setup) needs macOS or Linux; Windows gets the library.
dependencies = [
    "igraph>=1.0",
    "numpy",
    "scipy>=1.10",
    "pandas>=2.0; sys_platform != 'win32'",
    "matplotlib>=3.7; sys_platform != 'win32'",
    "networkx>=3.0; sys_platform != 'win32'",
    "pyarrow>=14; sys_platform != 'win32'",
    "duckdb>=1.0; sys_platform != 'win32'",
    "tqdm>=4.60; sys_platform != 'win32'",
]
keywords = ["community detection", "hedonic games", "graphs", "networks", "overlapping communities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
# One-to-one matching in hedonic.metrics (Game.evaluate_against "one_to_one_f1"); scipy is now a dependency, the
# extra is kept so `pip install "hedonic[metrics]"` still works.
metrics = ["scipy>=1.10"]

[project.scripts]
hedonic = "hedonic.experiments.CLI:hedonic_main"
hedonic-exp = "hedonic.experiments.CLI:main"

[project.urls]
Homepage = "https://github.com/lucaslopes/hedonic"
Documentation = "https://lucaslopes.github.io/hedonic/"

[build-system]
# setuptools: the package compiles its C core (native/, see setup.py) into the
# extension hedonic._core.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hedonic = ["py.typed"]
# Shipped run configs (`hedonic run queue paper`, `--config NAME`) and the external-method workers, including the
# locked CDlib project (slpa_env/pyproject.toml and uv.lock): hedonic.experiments.resources finds them.
"hedonic.experiments" = ["configs/*.toml", "workers/*.py", "workers/*.md", "workers/slpa_env/*.py",
                         "workers/slpa_env/pyproject.toml", "workers/slpa_env/uv.lock"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", ".venv/*"]
