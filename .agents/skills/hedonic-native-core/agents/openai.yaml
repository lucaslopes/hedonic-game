interface:
  display_name: "Hedonic native core"
  short_description: "Develop, verify and release hedonic's own Rust core"
  default_prompt: "Use $hedonic-native-core to change or measure the Rust core in native/rust (hedonic._core) in an isolated worktree with an arm64 venv: run the cargo tests, rebuild it with maturin develop, check the build matches the checkout with scripts/fresh.py, run the libm check and the pinned Python tests, and compare the scripts/bitcheck.py fingerprint with the base build (the same as hedonic 2.0's C core), without pushing, tagging or publishing anything."
