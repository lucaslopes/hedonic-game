# Default hedonic experiment config (repo: configs/hedonic.toml).
# Override with --config path.toml or HEDONIC_CONFIG.
#
# Priority for paths: CLI flags > environment variables > this file > defaults.
#   HEDONIC_DBLP_DIR, HEDONIC_SYNTHETIC_DIR, HEDONIC_NETWORKS_DIR,
#   HEDONIC_OUTPUT_DIR, HEDONIC_CONFIG
#
# Use ~/… paths (expanded at load time). Avoid hard-coded /Users/<name>.

[paths]
# Full DBLP network directory (pkl/raw or dblp.pkl cache)
dblp_dir = "~/Databases/Hedonic/Networks/DBLP"
# Root containing all saved SNAP network directories
networks_dir = "~/Databases/Hedonic/Networks"
# Synthetic / PHYSA SBM results root
synthetic_dir = "~/Databases/Hedonic/PHYSA/Synthetic_Networks/V1020"
# Default root for experiment outputs / artifacts
output_dir = "~/Databases/Hedonic/experiments"

# Optional defaults for: hedonic-exp overlapping-resolution
[overlapping_resolution]
# Overrides paths.output_dir for this experiment only when CLI omits --output_dir
output_dir = "~/Databases/Hedonic/Networks/DBLP_CLI/resolution_f1"
# data_dir = "~/Databases/Hedonic/Networks/DBLP"
resolutions = "0:1:11"
seeds = "0-4"
# confidence = 0.95

# Complete, resumable reproduction of docs/papers/overlapping_communities/main.tex.
# One command launches a tmux session with independent dataset shards:
#   uv run hedonic-exp reproduce-overlapping-paper
#
# Before launching tmux, the runner loads each graph once, measures n, m, and
# the maximum GT memberships per node, estimates each detector peak, and packs
# only memory-safe jobs into concurrent waves. The plan records every estimate.
[overlapping_paper]
profile = "full"
data_root = "~/Databases/Hedonic/Networks"
output_dir = "docs/papers/overlapping_communities/artifacts/full"
paper_dir = "docs/papers/overlapping_communities"
tmux_session = "hedonic-overlapping-paper"

# The paper compares three multi-phase hedonic density resolutions with
# independent baselines. Every multi-phase hedonic variant uses
# allow_isolation = true and the same seed-dependent disjoint warm start.
# hedonic_local is intentionally excluded from this protocol.
methods = ["hedonic_multiphase", "hedonic_multiphase_x10", "hedonic_multiphase_x100", "cpm", "demon"]
seeds = "0-4"
resolutions = "auto"
max_nodes = 0                 # <=0 disables the benchmark's bounded-subgraph cap
timeout_per_run = 3600        # seconds, enforced in a detector subprocess
# Baselines get shorter explicit limits. When both method and dataset limits
# apply, the runner uses the smaller value. A resource-exhausted CPM/DEMON run
# is recorded as skipped_not_scalable and is not automatically repeated.
timeout_by_method = { cpm = 1800, demon = 1800, hedonic_multiphase = 3600, hedonic_multiphase_x10 = 3600, hedonic_multiphase_x100 = 3600 }
timeout_by_dataset = { livejournal = 1800, youtube = 1800, wikipedia = 1800 }
omega = true
omega_sample_size = 100000
resume = true
retry_attempts = 0            # never repeat timeout/OOM/memory failures by default

# On this 64-GiB unified-memory Mac, reserve 24 GiB for macOS and other apps.
# The remaining 40 GiB is a hard scheduling budget; a process-tree RSS monitor
# kills any detector/descendant exceeding its per-job limit. Do not raise this without
# examining plan.json.
memory_budget_gb = "auto"
memory_reserve_gb = 24
memory_safety_factor = 1.5
max_parallel_workers = "auto"
max_parallel_cap = 2
poll_seconds = 10
compile_paper = true

# The first four supplied selected covers and Wikipedia's category cover are
# intentionally separate ground truths. We never merge `all` and `top5000`.
[[overlapping_paper.jobs]]
name = "amazon-top5000"
dataset = "amazon"
cover = "top5000"
weight = 2

[[overlapping_paper.jobs]]
name = "dblp-top5000"
dataset = "dblp"
cover = "top5000"
weight = 1

[[overlapping_paper.jobs]]
name = "livejournal-top5000"
dataset = "livejournal"
cover = "top5000"
weight = 5

[[overlapping_paper.jobs]]
name = "youtube-top5000"
dataset = "youtube"
cover = "top5000"
weight = 3

[[overlapping_paper.jobs]]
name = "wikipedia-all"
dataset = "wikipedia"
cover = "all"
weight = 5
