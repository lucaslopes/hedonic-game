# Default hedonic experiment configuration.
# Override with --config path.toml or HEDONIC_CONFIG.
#
# Priority: CLI flags > environment variables > this file > built-in defaults.
# Use home-relative paths so this file remains portable across checkouts.

[paths]
dblp_dir = "~/Databases/Hedonic/Networks/DBLP"
networks_dir = "~/Databases/Hedonic/Networks"
synthetic_dir = "~/Databases/Hedonic/PHYSA/Synthetic_Networks/V1020"
output_dir = "artifacts"

[overlapping_resolution]
output_dir = "artifacts/overlapping/resolution_f1"
# data_dir = "~/Databases/Hedonic/Networks/DBLP"
resolutions = "0:1:11"
seeds = "0-4"

# Manuscript and full-paper protocol settings are maintained in the private
# research checkout and are intentionally absent from the public configuration.
