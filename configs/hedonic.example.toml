# Example hedonic experiment configuration.
# Copy or edit configs/hedonic.toml, or pass --config path.toml / set
# HEDONIC_CONFIG. CLI flags take precedence over environment variables and
# TOML values. Prefer home-relative paths so configs remain portable.

[paths]
dblp_dir = "~/Databases/Hedonic/Networks/DBLP"
networks_dir = "~/Databases/Hedonic/Networks"
synthetic_dir = "~/Databases/Hedonic/PHYSA/Synthetic_Networks/V1020"
output_dir = "artifacts"

[overlapping_resolution]
output_dir = "artifacts/overlapping/resolution_f1"
# data_dir = "~/Databases/Hedonic/Networks/DBLP"
resolutions = "0:1:11"
seeds = "0-4"

# Manuscript and full-paper protocol settings are intentionally omitted from
# the public example. Supply a private TOML file for manuscript reproduction.
