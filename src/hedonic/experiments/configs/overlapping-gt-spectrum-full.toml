# Ground-truth robustness spectrum on the overlap paper's eight network/cover pairs: DBLP, Amazon and YouTube with both
# covers, Friendster and LiveJournal with top5000 (the graph of a pair is the subgraph its cover induces). Start with:  hedonic run spectrum --config full  (= hedonic run spectrum-full).
# Output: --output-dir, else <output_dir from the user config>/<name>. A pair missing locally is downloaded first
# (--no-provision stops that).

[overlapping_gt_spectrum]
name = "gt-robustness"
workers = 8                                    # processes side by side; ~2 GB each (--workers overrides)

# The pairs in the order the study runs them: the top5000 covers first (DBLP, Amazon, YouTube, Friendster, LiveJournal),
# then the complete `all` covers (DBLP, Amazon, YouTube). A pair already in the output folder's ledger
# is not run again, so widening this list only adds the missing pairs; reordering it changes only what runs first.
pairs = ["dblp/top5000", "amazon/top5000", "youtube/top5000", "friendster/top5000", "livejournal/top5000",
         "dblp/all", "amazon/all", "youtube/all"]
uncovered_policy = "covered-induced"           # every vertex in a reference community
max_nodes = 0                                  # complete graph
isolation_policies = ["fixed_labels", "open_labels"]

seeds = "0-4"
# The bounded study's grids. Each pair's calibrated resolution joins both when the study reads a calibration file
# (--tuned hedonic_tuned.json, or a `tuned` key here; the paper queue passes it).
detector_resolutions = "0+geom:1e-4:1:9"
audit_resolutions = "0:1:101+geom:1e-4:1:33"

robustness_atol = 1e-10
robustness_rtol = 1e-9
omega = true
omega_sample_size = 100000
timeout_per_run = 3600
