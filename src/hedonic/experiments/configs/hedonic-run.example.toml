# Example per-user settings for `hedonic run`.
# Copy to ~/.config/hedonic/config.toml (or point HEDONIC_CONFIG at a copy),
# or build it with `hedonic config set KEY VALUE`.

# What a bare `hedonic run` starts: a named config (default, paper, or one of
# the [profiles.*] below) or a path to a .json/.toml config file.
run = "paper"

[defaults]          # machine settings, applied to every run unless a flag overrides them
output_dir = "~/hedonic-runs"
# cache_dir = "~/.cache/hedonic"
# network_root = "~/hedonic-data/networks"   # where `hedonic setup` puts the SNAP files
# threads = 8

[profiles.quick]    # your own named configs: any `hedonic run exp` setting
networks = ["dblp", "amazon"]
methods = ["hedonic", "codeseg", "fox", "clique_percolation"]
nodes = 20000
seeds = "0-4"
# order = ["seed", "method", "network"]   # loop nesting, outermost first (network, seed and method once each)

[profiles.paper-3seeds]
config = "paper"    # start from a named config and change a few settings
seeds = "0-2"

# Covers: every network is run once per ground-truth cover (dblp:all, dblp:top5000, amazon:all, ...), and with
# induce = "covered" each method detects on the subgraph induced by the vertices the cover contains (the paper's
# benchmark is the shipped config paper-benchmark: hedonic run exp --config paper-benchmark).
# covers = ["all", "top5000"]
# induce = "covered"
