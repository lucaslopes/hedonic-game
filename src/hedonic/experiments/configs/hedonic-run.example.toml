# Example per-user settings for `hedonic run`.
# Copy to ~/.config/hedonic/config.toml (or point HEDONIC_CONFIG at a copy),
# or build it with `hedonic config set KEY VALUE`.

[defaults]          # machine settings
# disjoint_output_root = "~/Databases/Hedonic/Disjoint"   # the default: `hedonic run disjoint` runs and queues go under it
# threads = 8       # kept for your own scripts; no hedonic 1 run reads it
