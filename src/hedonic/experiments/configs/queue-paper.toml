# The overlap paper's experiment queue: six runs over eight SNAP network:cover pairs.
#
#   hedonic setup --all                     # once: download the eight pairs and build the eight baselines
#   hedonic run queue paper --dry-run       # the plan, what is already done, and what setup still misses
#   hedonic run queue paper                 # start (durable: closing the terminal does not stop it)
#   hedonic run status paper-queue          # progress; `hedonic run attach paper-queue` opens the live tree
#   hedonic run stop paper-queue            # stop; run the same `hedonic run queue paper` again to continue
#
# {root} is the folder every run writes into: `--root DIR`, by default <output_dir>/paper-queue with the output_dir of
# `hedonic config` (else ~/Databases/Hedonic/Overlap). Running the queue again skips what its files on disk show finished and
# resumes the rest. The two calibrations come first because the later runs read their results (--tuned); then the
# synthetic study; then leveraging-gt, gt-robustness and the benchmark go pair by pair. `schedule = "shortest"` runs one
# step at a time, as always, but takes at each turn the ready step with the smallest estimate (the ETA of the queue
# view), so the short pairs of every run finish before the long benchmark pairs; a run that reads another's result
# (--tuned) waits for it, and gt-robustness takes its pairs in the order of `pairs`. `--schedule file` restores the
# file's order (pair by pair, in the order of `pairs`).

name = "paper-queue"
schedule = "shortest"
pairs = ["dblp:top5000", "amazon:top5000", "youtube:top5000", "friendster:top5000", "livejournal:top5000",
         "dblp:all", "amazon:all", "youtube:all"]

[[items]]
name = "hedonic-calibration"
short = "calibrate"
title = "precondition: Hedonic (gamma, cap) per pair"
about = "Searches Hedonic's resolution and membership cap on each pair's covered subgraph, scored against that pair's cover. Writes hoc_tuned.json, which leveraging-gt, gt-robustness and the benchmark read."
run = ["calibrate", "--networks", "dblp:top5000,amazon:top5000,youtube:top5000,friendster:top5000,livejournal:top5000,dblp:all,amazon:all,youtube:all", "--mode", "auto", "--name", "hedonic-calibration", "--output-dir", "{root}/hedonic-calibration"]

[[items]]
name = "baseline-calibration"
short = "baselines"
title = "precondition: the baselines' parameters per pair"
about = "Chooses CliquePerc k, ANGEL phi and the BigCLAM / NEO-K-Means K on each pair's covered subgraph without ground truth and fixes the other baselines at their published values. ANGEL tries at most 3 settings in 60 minutes per pair. A search that ends without a setting takes the nearest calibrated pair's, recorded as transferred. Writes baseline_tuned.json, which the benchmark reads."
run = ["calibrate-baselines", "--networks", "dblp:top5000,amazon:top5000,youtube:top5000,friendster:top5000,livejournal:top5000,dblp:all,amazon:all,youtube:all", "--methods", "codeseg,ncgame,ego_splitting,fox,clique_percolation,angel,bigclam,neo_kmeans", "--max-evals", "8", "--max-minutes", "240", "--eval-timeout-minutes", "60", "--replicates", "1", "--method-budget", "angel=3:60", "--transfer-missing", "--name", "baseline-calibration", "--output-dir", "{root}/baseline-calibration"]

[[items]]
name = "synthetic-networks"
short = "synthetic"
title = "Appendix: controlled-overlap heatmap"
about = "Synthetic LFR-derived graphs with a controlled overlap: caps, starts and resolutions crossed. No network and no cover."
run = ["controlled", "--config", "overlap-heatmap", "--name", "synthetic-networks", "--output-dir", "{root}/synthetic-networks"]

[[items]]
name = "leveraging-gt"
by_pair = true
short = "leverage"
title = "Hedonic from a corrupted cover"
about = "Hedonic local moving started from the ground-truth cover corrupted by degree-preserving incidence switches: 9 corruption levels x 10 seeds per pair, at the calibrated settings."
run = ["startcurve", "--config", "start-quality-hoc-local", "--tuned", "{root}/hedonic-calibration/hoc_tuned.json", "--name", "leveraging-gt", "--output-dir", "{root}/leveraging-gt"]

[[items]]
name = "gt-robustness"
by_pair = true
short = "gt-robust"
title = "stability of the supplied covers"
about = "Exact stability of every supplied ground-truth cover over resolution (fixed and open labels), then local moving from the exact cover at each resolution and seed, on the subgraph the cover induces. Each pair's calibrated resolution (hoc_tuned.json) joins its grids."
run = ["spectrum", "--config", "full", "--tuned", "{root}/hedonic-calibration/hoc_tuned.json", "--name", "gt-robustness", "--output-dir", "{root}/gt-robustness"]

[[items]]
name = "benchmark"
by_pair = true
short = "benchmark"
title = "accuracy, time and robustness"
about = "Hedonic and eight baselines on the subgraph each cover induces, one detector at a time (time and memory are results): seeds 0-9 for Hedonic, ANGEL and Ego-Splitting, one run (seed 0) for the deterministic baselines (CoDeSEG at one thread among them). Each saved cover is audited for robustness right after its run."
run = ["exp", "--config", "paper-benchmark", "--tuned", "{root}/hedonic-calibration/hoc_tuned.json,{root}/baseline-calibration/baseline_tuned.json", "--name", "benchmark", "--output-dir", "{root}/benchmark", "--yes"]
