# Exact post-hoc stability of the SNAP ground-truth cover on the complete Amazon graph.
# Start with:  hedonic run posthoc --config amazon-full
# Progress, ETA and status:  hedonic run status | attach | list
# Output: --output-dir, else <output_dir from the user config, or ~/hedonic-runs>/<name>/{summary.json, result.json.gz}
# Without audit_resolutions the spectrum's registered 131-point audit grid is used. A pair missing locally is
# downloaded from SNAP first.

[overlapping_gt_posthoc]
name = "gt-posthoc-amazon-all-full"
dataset = "amazon"
cover = "all"
max_nodes = 0                # complete graph
workers = 8                  # forked processes that split the vertices (--workers overrides)
atol = 1e-10
rtol = 1e-9
