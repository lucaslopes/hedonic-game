# Both papers, one after the other: the overlapping-communities paper's queue, then the disjoint paper's.
#
#   hedonic run queue all --dry-run      # both plans, and what is already done
#   hedonic run queue all                # start (durable); `hedonic run attach all-queue` opens the tree of both
#
# An item whose run is ["queue", FILE|NAME] is a whole queue: it is started, waited for until it completes, and
# judged from its files as that queue judges its own items, so running this again skips a finished paper. Each inner
# queue writes into its own root (its default, or "--root", DIR after the name), never into this queue's. Edit a copy
# of this file to chain other queues: `hedonic run queue my-queues.toml`.

name = "all-queue"

[[items]]
short = "overlap"
title = "the overlapping-communities paper"
about = "hedonic run queue overlap: Hedonic and the eight baselines on the SNAP graph/cover pairs, method by method."
run = ["queue", "overlap"]

[[items]]
short = "disjoint"
title = "the disjoint paper"
about = "hedonic run queue disjoint: the SBM pipeline check, then the 100-seed grid."
run = ["queue", "disjoint"]
