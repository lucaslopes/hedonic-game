# The overlap paper's experiment queue, in two phases, each method by method.
#
#   hedonic setup --all                     # once: download the eight pairs and build the eight baselines
#   hedonic run queue overlap --dry-run       # the plan, what is already done, and what setup still misses
#   hedonic run queue overlap                 # start (durable: closing the terminal does not stop it)
#   hedonic run status overlap-queue          # progress; `hedonic run attach overlap-queue` opens the live tree
#   hedonic run stop overlap-queue            # stop; run the same `hedonic run queue overlap` again to continue
#
# {root} is the folder every run writes into: `--root DIR`, by default <output_dir>/overlap-queue with the output_dir of
# `hedonic config` (else ~/Databases/Hedonic/Overlap). Running the queue again skips what its files on disk show finished and
# resumes the rest.
#
# Phase 1 runs every method on DBLP, Amazon and YouTube (top5000 and all covers); phase 2 runs every method again, Hedonic
# first, on LiveJournal/top5000 and Friendster/top5000, the largest covered subgraphs (1.5 and 4 million edges), so a slow
# method there cannot hold up the rest. Items run in the order of this file (`schedule = "file"`).
#
# Hedonic: synthetic networks, then the calibration, then pair by pair (the queue's `pairs`) the ground-truth robustness,
# leveraging the ground truth and the benchmark rows. The calibration searches the resolution gamma only, with no
# membership cap (max_memberships -1), on each pair's covered subgraph against that pair's cover (`--cap unlimited`: a
# log grid over [1e-6, 0.5], then golden section): in-sample, it shows the method's reach at its best resolution. The
# synthetic study crosses a resolution grid with the planted cap and no cap, so a label-free resolution rule can be
# scored against the tuned one. Leveraging the ground truth starts from the corrupted reference and caps every vertex at
# the reference's largest multiplicity (`--cap reference`).
#
# Baselines, in this order: the published-setting, deterministic ones whose results already exist (CoDeSEG, NcGame, FOX),
# the calibrated deterministic ones (BigCLAM, NEO-K-Means, CliquePerc), then the seeded ones with ten runs per pair
# (Ego-Splitting, ANGEL, the longest). Each has its own calibration folder (a fixed method's is its recorded published
# setting) that adopts the searches baseline-calibration-rc1 finished, and every benchmark item writes into the one
# `benchmark` folder, so a unit already on disk with the same settings is reused.

name = "overlap-queue"
schedule = "file"
pairs = ["dblp:top5000", "dblp:all", "amazon:top5000", "amazon:all", "youtube:top5000", "youtube:all"]

[[items]]
name = "synthetic-hedonic"
short = "synthetic"
title = "Hedonic: synthetic networks"
about = "LFR-derived graphs with a controlled overlap (mu x overlap fraction x 10 seeds), Hedonic at twelve resolutions (density x 2^-6 .. 2^5) with the planted cap (2) and no cap. The best grid point is the tuned resolution a label-free rule is scored against."
run = ["controlled", "--config", "overlap-heatmap-gamma", "--name", "synthetic-hedonic", "--output-dir", "{root}/synthetic-hedonic"]

[[items]]
name = "calibration-hedonic"
short = "calibrate"
title = "Hedonic: calibration (DBLP, Amazon and YouTube)"
about = "Searches Hedonic's resolution on each pair's covered subgraph with no membership cap (-1), scored against that pair's cover. Writes hoc_tuned.json, which the Hedonic experiments read."
run = ["calibrate", "--cap", "unlimited", "--networks", "dblp:top5000,dblp:all,amazon:top5000,amazon:all,youtube:top5000,youtube:all", "--name", "calibration-hedonic", "--output-dir", "{root}/calibration-hedonic"]

[[items]]
name = "gt-robustness"
by_pair = true
short = "gt-robust"
title = "Hedonic: ground-truth robustness (DBLP, Amazon and YouTube)"
about = "Exact stability of every supplied ground-truth cover over resolution (fixed and open labels), then local moving from the exact cover at each resolution and seed, on the subgraph the cover induces. Each pair's calibrated resolution joins its grids."
run = ["spectrum", "--config", "full", "--pairs", "dblp/top5000,dblp/all,amazon/top5000,amazon/all,youtube/top5000,youtube/all", "--tuned", "{root}/calibration-hedonic/hoc_tuned.json", "--name", "gt-robustness", "--output-dir", "{root}/gt-robustness"]

[[items]]
name = "leveraging-gt"
by_pair = true
short = "leverage"
title = "Hedonic: leveraging the ground truth (DBLP, Amazon and YouTube)"
about = "Hedonic local moving started from the ground-truth cover corrupted by degree-preserving incidence switches: 9 corruption levels x 10 seeds per pair, at the calibrated gamma, with the cap set to the reference's largest number of communities on one vertex."
run = ["startcurve", "--config", "start-quality-hoc-local", "--networks", "dblp:top5000,dblp:all,amazon:top5000,amazon:all,youtube:top5000,youtube:all", "--cap", "reference", "--tuned", "{root}/calibration-hedonic/hoc_tuned.json", "--name", "leveraging-gt", "--output-dir", "{root}/leveraging-gt"]

[[items]]
name = "benchmark-hedonic"
by_pair = true
short = "bench-hed"
title = "Hedonic: benchmark (DBLP, Amazon and YouTube)"
about = "Hedonic at its calibrated gamma and no cap, seeds 0-9, on the subgraph each cover induces; every saved cover is audited for robustness."
run = ["exp", "--config", "paper-benchmark", "--networks", "dblp:top5000,dblp:all,amazon:top5000,amazon:all,youtube:top5000,youtube:all", "--methods", "hedonic", "--tuned", "{root}/calibration-hedonic/hoc_tuned.json", "--name", "benchmark-hedonic", "--output-dir", "{root}/benchmark", "--shared-folder", "--yes"]

[[items]]
name = "calibration-codeseg"
short = "cal-codeseg"
title = "CoDeSEG: calibration (DBLP, Amazon and YouTube)"
about = "CoDeSEG on each pair's covered subgraph without ground truth (a fixed method keeps its published setting). Adopts the searches baseline-calibration-rc1 finished."
run = ["calibrate-baselines", "--networks", "dblp:top5000,dblp:all,amazon:top5000,amazon:all,youtube:top5000,youtube:all", "--methods", "codeseg", "--max-evals", "8", "--max-minutes", "240", "--eval-timeout-minutes", "60", "--replicates", "1", "--transfer-missing", "--adopt-from", "{root}/baseline-calibration-rc1", "--name", "calibration-codeseg", "--output-dir", "{root}/calibration-codeseg"]

[[items]]
name = "benchmark-codeseg"
short = "bench-codeseg"
title = "CoDeSEG: benchmark (DBLP, Amazon and YouTube)"
about = "CoDeSEG on the subgraph each cover induces (seeds 0-9 for a seeded method, one run for a deterministic one); every saved cover is audited for robustness."
run = ["exp", "--config", "paper-benchmark", "--networks", "dblp:top5000,dblp:all,amazon:top5000,amazon:all,youtube:top5000,youtube:all", "--methods", "codeseg", "--tuned", "{root}/calibration-codeseg/baseline_tuned.json", "--name", "benchmark-codeseg", "--output-dir", "{root}/benchmark", "--shared-folder", "--yes"]

