name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --extra experiments
      - name: Test public API and release gates
        run: >-
          uv run --with pytest pytest -q
          tests/test_release_helper.py
          tests/test_overlapping_and_experiments.py::TestCommunityHedonic
      - name: Compile package sources
        run: python -m compileall -q src
      - name: Build distributions
        run: uv build --no-sources
      - name: Validate package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: hedonic-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Verify tag version
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'tag/version mismatch'
          PY
      - name: Publish exact successful main artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: ./scripts/release.sh publish-pypi --commit "$GITHUB_SHA" --workflow 'Publish to PyPI' --publish
